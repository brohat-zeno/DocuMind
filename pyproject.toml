[project]
name = "documind-backend"
version = "0.1.0"
description = "DocuMind: document ingestion, conversational RAG, and interview booking"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.5",
  "qdrant-client>=1.12",
  "sqlalchemy>=2.0",
  "redis>=5.2",
  "openai>=1.55",
  "pypdf>=5.0",
  "python-multipart>=0.0.18",
  "fastembed>=0.7",
]
[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-asyncio", "httpx"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.11"
strict = true
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
